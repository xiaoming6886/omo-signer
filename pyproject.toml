[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omo-signer"
version = "1.0.0"
description = "生产级 LLM 多智能体通信签名基础设施 — 框架无关、算法无关的密码学身份验证"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Hao Yuming", email = "hym17613236886@163.com"}]
keywords = ["llm", "multi-agent", "digital-signature", "ed25519", "sm2", "ecdsa", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security :: Cryptography",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "pynacl>=1.5.0",
    "gmssl>=3.2.0",
    "ecdsa>=0.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
omo-signer = "omo_signer:main"
omo-daemon = "omo_signing_daemon:main"

[project.urls]
Homepage = "https://github.com/xiaoming6886/omo-signer"
Repository = "https://github.com/xiaoming6886/omo-signer"
Issues = "https://github.com/xiaoming6886/omo-signer/issues"

[tool.setuptools]
package-dir = {"" = "src"}
